{% load static %}
<!DOCTYPE html>
<html>
      <head>
            <title>{% block meta_title %}JOB PORTAL &mdash; Find Your Job{% endblock %}</title>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
            <meta name="description" content="{% block meta_description %}Find jobs, hire talent, and manage applications on Job Portal.{% endblock %}" />
            <meta name="keywords" content="{% block meta_keywords %}job, portal, career, hiring, recruitment, job search, find job{% endblock %}" />
            <link rel="icon" type="image/png" href="{% static 'images/favicon.png' %}" />
            
            {% block extra_meta %}{% endblock %}

            {% include 'head.html' %}
      </head>
      <body id="top">
            {% include 'header.html' %}
            {% block content %}{% endblock %}
            {% include 'scripts.html' %} 
            {% block extra_scripts %} {% endblock %}
      </body>
</html>
